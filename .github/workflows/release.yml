name: Publish branch build

on:
  workflow_run:
    workflows: ["Patch and Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: Repository branch to build
        required: true
        default: main

permissions:
  contents: read

env:
  BUILD_BRANCH: ${{ inputs.branch || github.event.workflow_run.head_branch }}

jobs:
  package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ github.event.workflow_run.head_sha || format('refs/heads/{0}', inputs.branch) }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply patches
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          ./gradlew applyAllPatches --stacktrace
      - name: Package server
        run: |
          ./gradlew :scrap-server:createPaperclipJar --stacktrace
          cp scrap-server/build/libs/scrap-paperclip-*.jar server.jar
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: server.jar
          compression-level: 0
          retention-days: 1

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-branch-builds
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: server
          path: dist
      - name: Update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.package.outputs.sha }}
        run: bash .github/scripts/publish-branch.sh
